load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
env MCP_PUBLIC_ORIGIN;
worker_processes 2;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    js_import policy from /etc/nginx/mcp/policy.mjs;
    js_set $mcp_access policy.check;

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Apply before every route, including Web's existing MCP proxy paths.
        if ($mcp_access = deny) { return 403; }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        # Origin is forwarded unchanged by default. Never delete it before validation.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        location ~ ^/([^/]+/)?mcp(/.*)?$ {
            proxy_pass http://mcp-knot-api:8181;
        }

        location ^~ /.well-known/ {
            proxy_pass http://mcp-knot-api:8181;
        }

        location ^~ /api/ {
            proxy_pass http://mcp-knot-api:8181;
        }

        location / {
            proxy_pass http://mcp-knot-web:80;
        }
    }
}
