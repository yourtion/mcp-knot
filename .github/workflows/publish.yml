name: Publish Packages

on:
  workflow_run:
    workflows: [CI Pipeline]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version packages or publish to npm
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify CI tested the current main commit
        id: head
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale CI run; a newer main commit must pass CI first."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.head.outputs.current == 'true'
      - uses: actions/setup-node@v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        if: steps.head.outputs.current == 'true'
      - name: Use npm with OIDC support
        if: steps.head.outputs.current == 'true'
        run: npm install --global npm@11
      - name: Configure tokenless registry authentication
        if: steps.head.outputs.current == 'true'
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
      - name: Create version PR or build and publish packages
        id: changesets
        if: steps.head.outputs.current == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Publish Docker images (optional)
    needs: release
    if: needs.release.outputs.published == 'true' && vars.DOCKER_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [api, web]
        include:
          - image: api
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mcp-knot-${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/mcp-knot-${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
