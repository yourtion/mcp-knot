name: Publish Packages

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tag, four package versions and release commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.cjs check "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:validate
      - name: Use npm with OIDC support
        run: npm install --global npm@11
      - name: Configure tokenless registry authentication
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
      - name: Publish validated tarballs in dependency order
        run: node scripts/publish-packages.cjs
      - name: Complete GitHub Release after all npm packages succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Listing errors propagate; authentication/network errors are not absence.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$existing" | grep -Fx "$RELEASE_TAG" > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

  docker-publish:
    name: Publish Docker images (optional)
    needs: release
    if: vars.DOCKER_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [api, web]
        include:
          - image: api
            dockerfile: backend/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mcp-knot-${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/mcp-knot-${{ matrix.image }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
