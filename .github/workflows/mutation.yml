name: Mutation Testing

on:
  pull_request:
    branches: [main, fix/conformance-baseline-cleanup, fix/progress-notification-relay]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Force a full mutation run and rebuild the baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: 变异测试 (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [share, protocol, core, cli, backend, frontend]
    env:
      MUTATION_NODE_VERSION: '24'
      MUTATION_PROJECT: ${{ matrix.project }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.MUTATION_NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 编译工作区依赖
        run: pnpm build:production

      - name: 检查变异运行器错误报告
        run: pnpm test:mutation-runner

      - name: 查看基线输入清单
        run: node .github/scripts/baseline-inputs.mjs .github/mutation-cache-inputs.json --list

      - name: 计算基线兼容性键
        id: baseline-key
        run: |
          INPUTS_HASH="$(node .github/scripts/baseline-inputs.mjs .github/mutation-cache-inputs.json)"
          echo "prefix=mutation-${MUTATION_PROJECT}-v3-${RUNNER_OS}-node${MUTATION_NODE_VERSION}-${INPUTS_HASH}" >> "$GITHUB_OUTPUT"

      - name: 恢复 main 变异基线
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/mutation/${{ matrix.project }}/stryker-incremental.json
            reports/mutation/${{ matrix.project }}/stryker-incremental.json.inputs.json
          key: ${{ steps.baseline-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.baseline-key.outputs.prefix }}-

      - name: 运行变异测试
        env:
          FORCE_FULL: ${{ inputs.full == true }}
        run: |
          if [ "$FORCE_FULL" = "true" ]; then
            pnpm mutation:full
          else
            pnpm mutation
          fi

      - name: 保存 main 变异基线
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            reports/mutation/${{ matrix.project }}/stryker-incremental.json
            reports/mutation/${{ matrix.project }}/stryker-incremental.json.inputs.json
          key: ${{ steps.baseline.outputs.cache-primary-key }}

      - name: 上传变异测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/mutation/${{ matrix.project }}/
          if-no-files-found: warn
          retention-days: 14
