# MCP Knot Docker Compose 配置

services:
  # API 服务器
  mcp-knot-api:
    image: mcp-knot/api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '8181:8181'
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config
      - VALIDATION_KEY_SECRET=${VALIDATION_KEY_SECRET:-}
    volumes:
      # 挂载配置文件
      - type: bind
        source: ${MCP_KNOT_CONFIG_DIR:-./config}
        target: /app/config
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - mcp-knot-network

  # 前端服务器（可选）
  mcp-knot-web:
    image: mcp-knot/web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8180:80'
    depends_on:
      mcp-knot-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-knot-network

networks:
  mcp-knot-network:
    driver: bridge
